services:
  - type: web
    name: atlas-service-desk-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: DATABASE_PATH
        value: ./atlas.db
      - key: FLASK_DEBUG
        value: "0"
      - key: FRONTEND_ORIGIN
        value: https://atlas-service-desk-frontend.vercel.app
    healthCheckPath: /api/requests
